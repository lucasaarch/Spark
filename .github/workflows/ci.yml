name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Build and test macOS
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: SwiftLint
        run: scripts/lint.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-26.6-${{ hashFiles('**/Package.resolved') }}
      - name: Validate release scripts
        run: |
          bash -n scripts/*.sh
          plutil -lint Config/Spark-Info.plist Spark.xcodeproj/project.pbxproj
          git diff --check
      - name: Build and exercise real PTYs
        run: scripts/check.sh
      - name: Build universal app
        run: |
          xcodebuild -project Spark.xcodeproj -scheme Spark -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages -skipPackagePluginValidation \
            -disableAutomaticPackageResolution build ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual ENABLE_HARDENED_RUNTIME=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: .build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
